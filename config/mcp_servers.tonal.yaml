# Recommended read-only Tonal profile.
# Merge the `tonal` mapping under the existing `mcp_servers` key in
# ~/.hermes/config.yaml. Do not replace the rest of that file.
#
# `untrusted` requires approval for every tool that is not marked with
# readOnlyHint: true. Using `full` skips this MCP write-approval gate.
# Keep `untrusted` if you later enable write tools.
mcp_servers:
  tonal:
    command: python3
    args:
      - /Users/dlwiest/Projects/hermes-tonal/scripts/tonal_mcp_server.py
    enabled: true
    # Non-secret settings go here, not in ~/.hermes/.env. Uncomment and set an
    # absolute path if ts-tonal-mcp is not at ~/Projects/ts-tonal-mcp.
    # Credentials are NOT listed here: the launcher reads them from the Keychain
    # (or the env file) itself, so they never appear in config.yaml.
    # env:
    #   TONAL_MCP_SERVER_PATH: /absolute/path/to/ts-tonal-mcp/dist/index.js
    timeout: 300
    trust: untrusted
    tools:
      # These are raw server tool names. Do not add the mcp__tonal__ prefix.
      include:
        - get_muscle_readiness
        - get_user_stats
        - get_recent_progress
        - get_goal_metrics
        - get_strength_scores
        - list_workout_activities
        - get_workout_activity_details
        - get_workout_summary
        - get_recent_workouts
        - list_custom_workouts
        - get_custom_workout_details
        - get_workout_for_editing
        - get_movements
        - search_movements
        - estimate_workout_duration
